version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
  pre_build:
    commands:
      - cd LifeGame
      - npm ci --cache /root/.npm --prefer-offline
  build:
    commands:
      - npm run lint
      - npm test
      - npm run build
artifacts:
  files:
    - '**/*'
  base-directory: LifeGame/dist/LifeGame
cache:
  paths:
    - /root/.npm/**/*
